<!DOCTYPE html>
<html>
<head>

<title>KitjuuHost Dashboard</title>

<style>

body{
background:#0f172a;
font-family:Arial;
color:white;
margin:0;
}

.sidebar{
width:200px;
height:100vh;
background:#020617;
position:fixed;
padding:20px;
}

.sidebar h2{
color:#22c55e;
}

.sidebar a{
display:block;
color:white;
margin:12px 0;
text-decoration:none;
}

.main{
margin-left:220px;
padding:30px;
}

.card{
background:#1e293b;
padding:15px;
border-radius:8px;
margin-bottom:20px;
}

button{
background:#22c55e;
border:none;
padding:10px 16px;
margin:5px;
border-radius:6px;
color:white;
cursor:pointer;
}

.console{
background:black;
padding:15px;
height:180px;
overflow:auto;
font-family:monospace;
}

input,select{
padding:6px;
border-radius:5px;
}

.server{
background:#1e293b;
padding:10px;
margin:10px 0;
border-radius:6px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>KitjuuHost</h2>

<a href="#">Dashboard</a>
<a href="#">Servers</a>
<a href="#">Plugins</a>
<a href="#">Files</a>

</div>

<div class="main">

<h1>Server Manager</h1>

<div class="card">

<input id="servername" placeholder="Server name">

<button onclick="createServer()">Create Server</button>

</div>

<div id="servers"></div>

<div class="card">

<h3>Server RAM</h3>

<select>

<option>1 GB</option>
<option>2 GB</option>
<option>4 GB</option>
<option>8 GB</option>

</select>

</div>

<div class="card">

<h3>Minecraft Version</h3>

<select>

<option>1.21</option>
<option>1.20</option>
<option>Paper</option>
<option>Forge</option>

</select>

</div>

<div class="card">

<h3>Plugin Installer</h3>

<button onclick="install('EssentialsX')">EssentialsX</button>
<button onclick="install('WorldEdit')">WorldEdit</button>
<button onclick="install('LuckPerms')">LuckPerms</button>

</div>

<div class="card">

<h3>Upload World</h3>

<input type="file">

</div>

<div class="card">

<h3>Server Console</h3>

<div class="console" id="console">

> Console ready

</div>

</div>

</div>

<script>

let servers=JSON.parse(localStorage.getItem("servers"))||[];

function renderServers(){

let container=document.getElementById("servers");

if(servers.length===0){
container.innerHTML="<p>No servers created yet</p>";
return;
}

container.innerHTML="";

servers.forEach((server,index)=>{

container.innerHTML+=`

<div class="server">

<h3>${server}</h3>

<button onclick="startServer(${index})">Start</button>
<button onclick="stopServer(${index})">Stop</button>
<button onclick="deleteServer(${index})">Delete</button>

</div>

`;

});

}

function createServer(){

let name=document.getElementById("servername").value;

if(name===""){
alert("Enter server name");
return;
}

servers.push(name);

localStorage.setItem("servers",JSON.stringify(servers));

renderServers();

log("Server "+name+" created");

}

function startServer(i){

log(servers[i]+" starting...");

}

function stopServer(i){

log(servers[i]+" stopping...");

}

function deleteServer(i){

log(servers[i]+" deleted");

servers.splice(i,1);

localStorage.setItem("servers",JSON.stringify(servers));

renderServers();

}

function install(plugin){

log(plugin+" installed");

}

function log(text){

let consoleBox=document.getElementById("console");

consoleBox.innerHTML+="<br>> "+text;

}

renderServers();

</script>

</body>
</html>
