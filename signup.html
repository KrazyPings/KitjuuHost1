<!DOCTYPE html>
<html>
<head>
<title>Signup - KitjuuHost</title>
</head>

<body>

<h1>Create Account</h1>

<input id="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Signup</button>

<p id="msg"></p>

<script>

function signup(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

if(email==="" || pass===""){
document.getElementById("msg").innerText="Please fill all fields";
return;
}

let existing=localStorage.getItem("userEmail");

if(existing===email){
document.getElementById("msg").innerText="Account already exists";
return;
}

localStorage.setItem("userEmail",email);
localStorage.setItem("userPass",pass);

document.getElementById("msg").innerText="Account created successfully";

setTimeout(()=>{
window.location="login.html";
},1500);

}

</script>

</body>
</html>
